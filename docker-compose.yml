services:
  db:
    image: mysql:8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --restrict-fk-on-non-standard-key=OFF
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: army
    volumes:
      - mysql_data:/var/lib/mysql
      - ./army.sql:/docker-entrypoint-initdb.d/001-army.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -Darmy -e 'SELECT 1 FROM caption LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      MOBIARMY_HEADLESS: "true"
      MOBIARMY_PORT: "8122"
      DB_URL: jdbc:mysql://db:3306/army?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ""
      ADMIN_ENABLED: "true"
      ADMIN_HOST: "0.0.0.0"
      ADMIN_PORT: "8080"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8122:8122"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
